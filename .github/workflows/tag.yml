name: Add tarball to draft release
on:
  push:
    tags: ["v*"]

jobs:
  add-tarball:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          package-manager-cache: false
      - run: npm pack
      - uses: actions/attest@v4
        with:
          subject-path: "${{ github.workspace }}/*.tgz"
      - run: gh release create ${{ github.ref_name }} --draft *.tgz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
